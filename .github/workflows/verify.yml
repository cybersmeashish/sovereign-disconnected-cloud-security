name: Verify disconnected-cloud reference

on:
  push:
    branches: [main]
    paths:
      - 'lab/**'
      - 'assurance/**'
      - 'tools/**'
      - 'tests/**'
      - 'examples/**'
      - 'architecture/*.json'
      - 'Dockerfile'
      - 'requirements.lock'
      - '.github/workflows/verify.yml'
  pull_request:
    paths:
      - 'lab/**'
      - 'assurance/**'
      - 'tools/**'
      - 'tests/**'
      - 'examples/**'
      - 'architecture/*.json'
      - 'Dockerfile'
      - 'requirements.lock'
      - '.github/workflows/verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-11-18
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, resolved 2026-11-18
        with:
          python-version: '3.12'
      - name: Install hash-locked host dependencies
        run: python -m pip install --no-cache-dir --require-hashes -r requirements.lock
      - name: Run standard-library regression cases
        run: python -m unittest discover -s tests -v
      - name: Validate declared flows and model disconnection
        run: |
          python -m tools.flow_validator architecture/flow-register.json
          python -m tools.dependency_analyzer examples/dependencies.json --disconnect
      - name: Prepare pinned runtime image
        run: |
          docker pull python:3.12-slim@sha256:5e2bdb1b0d542d5039cffb8181c65930093949194a65c365dfb1b0fe13a4fa5b
          python -m tools.prepare_dependencies
          docker build --network=none --pull=false -t ashish-sovereign-lab:contributions-01-28 .
      - name: Verify network-disabled container and source matching
        run: |
          python -m tools.run_isolated_lab --image ashish-sovereign-lab:contributions-01-28 --output evidence/ci/isolation-report.json
          python -m tools.run_isolated_lab --expanded --image ashish-sovereign-lab:contributions-01-28 --output evidence/ci/expanded-isolation-report.json
      - name: Retain bounded evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, resolved 2026-11-18
        with:
          name: disconnected-cloud-reference-evidence
          path: evidence/ci/*.json
          retention-days: 14
