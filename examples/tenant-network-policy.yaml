# Design example only. No Kubernetes cluster was deployed or tested.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: synthetic-government-tenant-a
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: records-from-api
  namespace: synthetic-government-tenant-a
spec:
  podSelector:
    matchLabels: {role: records}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {role: api}
      ports:
        - {protocol: TCP, port: 8443}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-to-records
  namespace: synthetic-government-tenant-a
spec:
  podSelector:
    matchLabels: {role: api}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {role: records}
      ports:
        - {protocol: TCP, port: 8443}
